<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gravity Shift</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070a12;
    --panel: rgba(11, 16, 31, 0.86);
    --line: rgba(142, 164, 255, 0.22);
    --text: #f4f7ff;
    --muted: #9da9c8;
    --accent: #72e8ff;
    --accent2: #a275ff;
    --danger: #ff5f7d;
    --good: #77ffb0;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(89, 91, 255, .18), transparent 32%),
      radial-gradient(circle at 80% 80%, rgba(0, 221, 255, .12), transparent 30%),
      var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #topbar {
    position: fixed;
    left: 50%;
    top: max(12px, env(safe-area-inset-top));
    transform: translateX(-50%);
    z-index: 5;
    width: min(920px, calc(100vw - 24px));
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  .hud-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .chip {
    min-height: 38px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(7, 10, 20, .72);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .chip small {
    color: var(--muted);
    font-weight: 700;
  }
  #gravityChip {
    min-width: 122px;
    justify-content: center;
  }
  #gravityArrow {
    color: var(--accent);
    font-size: 21px;
    text-shadow: 0 0 16px rgba(114,232,255,.7);
  }
  .icon-btn {
    pointer-events: auto;
    width: 40px;
    height: 40px;
    border-radius: 13px;
    border: 1px solid var(--line);
    color: var(--text);
    background: rgba(7, 10, 20, .72);
    font-size: 17px;
    cursor: pointer;
    backdrop-filter: blur(12px);
  }
  .icon-btn:hover { border-color: rgba(114,232,255,.6); }
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(3, 5, 12, .45);
    backdrop-filter: blur(8px);
  }
  #overlay.hidden { display: none; }
  .panel {
    width: min(660px, 100%);
    max-height: calc(100vh - 36px);
    overflow: auto;
    padding: 28px;
    border-radius: 26px;
    border: 1px solid rgba(143,164,255,.26);
    background:
      linear-gradient(145deg, rgba(19,27,52,.96), rgba(7,11,24,.96));
    box-shadow:
      0 35px 100px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.05);
  }
  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: clamp(38px, 8vw, 72px);
    line-height: .95;
    letter-spacing: -.055em;
  }
  .gradient-text {
    background: linear-gradient(100deg, #fff 10%, #7deaff 50%, #ae8cff 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    margin: 16px 0 22px;
    max-width: 560px;
    color: var(--muted);
    line-height: 1.55;
    font-size: 15px;
  }
  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  button.primary, button.secondary {
    min-height: 46px;
    border-radius: 14px;
    padding: 0 18px;
    font: inherit;
    font-weight: 900;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, filter .12s ease;
  }
  button.primary {
    border: 0;
    color: #071018;
    background: linear-gradient(100deg, #7af0ff, #9b88ff);
    box-shadow: 0 12px 30px rgba(83,196,255,.22);
  }
  button.secondary {
    color: var(--text);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.04);
  }
  button.primary:hover, button.secondary:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .controls-card {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .control {
    padding: 12px;
    border-radius: 14px;
    border: 1px solid rgba(143,164,255,.14);
    background: rgba(255,255,255,.025);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }
  .control strong { color: var(--text); display:block; margin-bottom: 3px; }
  kbd {
    display:inline-grid;
    place-items:center;
    min-width: 25px;
    min-height: 24px;
    padding: 0 6px;
    margin: 0 2px;
    border: 1px solid rgba(255,255,255,.2);
    border-bottom-width: 3px;
    border-radius: 6px;
    background: rgba(255,255,255,.08);
    color: #fff;
    font: 800 12px/1 system-ui;
  }
  #levelGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 18px;
  }
  .level-btn {
    aspect-ratio: 1.35;
    border: 1px solid rgba(143,164,255,.18);
    border-radius: 15px;
    color: var(--text);
    background: rgba(255,255,255,.035);
    font: 900 15px system-ui;
    cursor: pointer;
  }
  .level-btn:hover:not(:disabled) { border-color: rgba(114,232,255,.65); }
  .level-btn:disabled {
    cursor: not-allowed;
    opacity: .38;
  }
  .level-btn .stars {
    display:block;
    margin-top:6px;
    color: #ffd765;
    letter-spacing: 2px;
    font-size: 11px;
  }
  #toast {
    position: fixed;
    z-index: 8;
    left: 50%;
    bottom: 116px;
    transform: translate(-50%, 20px);
    opacity: 0;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(143,164,255,.2);
    background: rgba(7,10,20,.84);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #mobileControls {
    position: fixed;
    z-index: 6;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: none;
    grid-template-columns: repeat(5, 52px);
    gap: 8px;
  }
  .touch-btn {
    width: 52px;
    height: 52px;
    border: 1px solid rgba(143,164,255,.25);
    border-radius: 15px;
    color: var(--text);
    background: rgba(7,10,20,.76);
    backdrop-filter: blur(12px);
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 10px 26px rgba(0,0,0,.28);
  }
  .touch-btn:active { transform: scale(.94); border-color: rgba(114,232,255,.75); }
  .touch-btn.reset { color: #ff9bb0; }
  @media (pointer: coarse), (max-width: 760px) {
    #mobileControls { display: grid; }
    #topbar { top: max(8px, env(safe-area-inset-top)); }
    .chip { padding: 7px 9px; font-size: 12px; min-height: 34px; }
    #movesChip, #timeChip { display:none; }
    .panel { padding: 22px; }
    .controls-card { grid-template-columns: 1fr; }
    #levelGrid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 460px) {
    #mobileControls {
      grid-template-columns: repeat(5, 46px);
      gap: 6px;
    }
    .touch-btn { width:46px; height:46px; border-radius:13px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Gravity Shift game canvas"></canvas>

<div id="topbar">
  <div class="hud-group">
    <div class="chip"><small>LEVEL</small><span id="levelText">1/8</span></div>
    <div class="chip" id="movesChip"><small>SHIFTS</small><span id="movesText">0</span></div>
    <div class="chip" id="timeChip"><small>TIME</small><span id="timeText">0.0</span></div>
  </div>
  <div class="hud-group">
    <div class="chip" id="gravityChip"><small>GRAVITY</small><span id="gravityArrow">↓</span><span id="gravityText">DOWN</span></div>
    <button class="icon-btn" id="pauseBtn" title="Pause">Ⅱ</button>
    <button class="icon-btn" id="soundBtn" title="Toggle sound">♪</button>
  </div>
</div>

<div id="toast">Gravity shifted</div>

<div id="mobileControls">
  <button class="touch-btn" data-gravity="left" aria-label="Gravity left">←</button>
  <button class="touch-btn" data-gravity="up" aria-label="Gravity up">↑</button>
  <button class="touch-btn" data-gravity="down" aria-label="Gravity down">↓</button>
  <button class="touch-btn" data-gravity="right" aria-label="Gravity right">→</button>
  <button class="touch-btn reset" id="mobileReset" aria-label="Restart">↻</button>
</div>

<div id="overlay">
  <section class="panel" id="panel"></section>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const toast = document.getElementById("toast");

  const levelText = document.getElementById("levelText");
  const movesText = document.getElementById("movesText");
  const timeText = document.getElementById("timeText");
  const gravityText = document.getElementById("gravityText");
  const gravityArrow = document.getElementById("gravityArrow");
  const soundBtn = document.getElementById("soundBtn");

  const TILE = 48;
  const COLS = 20;
  const ROWS = 14;
  const WORLD_W = COLS * TILE;
  const WORLD_H = ROWS * TILE;
  const PLAYER_R = 14;

  const levels = [
    {
      name: "First Pull",
      tip: "Use the arrow keys to change which way gravity pulls.",
      map: [
        "####################",
        "#S.................#",
        "#.......*..........#",
        "#......#####.......#",
        "#..................#",
        "#..............*...#",
        "#..........#####...#",
        "#..................#",
        "#...#####..........#",
        "#..........X.......#",
        "#..........X.......#",
        "#......*...X.....E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "Split Path",
      tip: "Switch direction before your momentum carries you into a hazard.",
      map: [
        "####################",
        "#S.......#.........#",
        "#........#.....*...#",
        "#..*.....#.........#",
        "#........#..XXXXX..#",
        "#........#.........#",
        "#........#####.....#",
        "#..................#",
        "#..#####...........#",
        "#..#..........###..#",
        "#..#....*..........#",
        "#..#.............E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "Needle",
      tip: "Small corrections beat frantic switching.",
      map: [
        "####################",
        "#S.................#",
        "#...##########.....#",
        "#..............*...#",
        "#.XXXXX............#",
        "#........######....#",
        "#..............X...#",
        "#..*...........X...#",
        "#..########....X...#",
        "#..............X...#",
        "#........*.....X...#",
        "#..............X.E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "Orbit",
      tip: "Use walls to cancel speed and redirect safely.",
      map: [
        "####################",
        "#S.................#",
        "#....#####.........#",
        "#....#...#....*....#",
        "#.*..#...#.........#",
        "#....#...#####.....#",
        "#....#.............#",
        "#....#####....XXX..#",
        "#.............X....#",
        "#..*..........X....#",
        "#.....#####...X....#",
        "#.............X..E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "Crossfire",
      tip: "The safest route is not always the shortest.",
      map: [
        "####################",
        "#S........#........#",
        "#..*......#....*...#",
        "#.....XXXXX........#",
        "#.........#........#",
        "#..####...#..####..#",
        "#.........#........#",
        "#XXXXXX........XXXX#",
        "#.........#........#",
        "#..####...#..####..#",
        "#.........#........#",
        "#...*.....#......E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "Gravity Well",
      tip: "Reverse gravity with Space when you need a fast escape.",
      map: [
        "####################",
        "#S.................#",
        "#..#####.......*...#",
        "#......X...........#",
        "#.*....X..######...#",
        "#......X...........#",
        "#......XXXXXX......#",
        "#.............X....#",
        "#..######.....X....#",
        "#.............X....#",
        "#....*........X....#",
        "#.............X..E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "The Machine",
      tip: "Q and E rotate gravity without reaching for the arrow keys.",
      map: [
        "####################",
        "#S....#............#",
        "#..*..#..XXXXX.....#",
        "#.....#............#",
        "#.....#####..####..#",
        "#..................#",
        "#..XXXX..#####.....#",
        "#..................#",
        "#.....#####..XXXX..#",
        "#..*...............#",
        "#.....#######......#",
        "#........*.......E.#",
        "#..................#",
        "####################"
      ]
    },
    {
      name: "Final Drift",
      tip: "Stay calm. Read the route one gravity shift at a time.",
      map: [
        "####################",
        "#S....X............#",
        "#..*..X..######....#",
        "#.....X............#",
        "#.....XXXXXX..XXX..#",
        "#..................#",
        "#..#####..*........#",
        "#.............####.#",
        "#.XXXXXX...........#",
        "#...........XXXXX..#",
        "#..*..######.......#",
        "#.................E#",
        "#..................#",
        "####################"
      ]
    }
  ];

  const gravityVectors = {
    down:  { x: 0, y: 1, arrow: "↓", label: "DOWN" },
    up:    { x: 0, y: -1, arrow: "↑", label: "UP" },
    left:  { x: -1, y: 0, arrow: "←", label: "LEFT" },
    right: { x: 1, y: 0, arrow: "→", label: "RIGHT" }
  };
  const clockwise = { down: "left", left: "up", up: "right", right: "down" };
  const counterClockwise = { down: "right", right: "up", up: "left", left: "down" };
  const opposite = { down: "up", up: "down", left: "right", right: "left" };

  let dpr = 1;
  let screenW = innerWidth;
  let screenH = innerHeight;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  let state = "menu";
  let levelIndex = 0;
  let map = [];
  let start = {x: 0, y: 0};
  let exit = {x: 0, y: 0};
  let player = {x: 0, y: 0, vx: 0, vy: 0, r: PLAYER_R, trail: []};
  let gravity = "down";
  let shifts = 0;
  let elapsed = 0;
  let stars = [];
  let collected = 0;
  let particles = [];
  let shake = 0;
  let deathFlash = 0;
  let transitionFlash = 0;
  let paused = false;
  let lastTime = performance.now();
  let toastTimer = null;
  let audioEnabled = true;
  let audioCtx = null;

  let saved = { unlocked: 1, stars: {} };
  try {
    const stored = JSON.parse(localStorage.getItem("gravityShiftProgress") || "null");
    if (stored && typeof stored === "object") saved = stored;
  } catch {
    localStorage.removeItem("gravityShiftProgress");
  }
  if (!Number.isInteger(saved.unlocked) || saved.unlocked < 1) saved.unlocked = 1;
  if (!saved.stars || typeof saved.stars !== "object") saved.stars = {};

  function saveProgress() {
    localStorage.setItem("gravityShiftProgress", JSON.stringify(saved));
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    screenW = innerWidth;
    screenH = innerHeight;
    canvas.width = Math.floor(screenW * dpr);
    canvas.height = Math.floor(screenH * dpr);
    canvas.style.width = screenW + "px";
    canvas.style.height = screenH + "px";
    scale = Math.min((screenW - 20) / WORLD_W, (screenH - 20) / WORLD_H);
    offsetX = (screenW - WORLD_W * scale) / 2;
    offsetY = (screenH - WORLD_H * scale) / 2;
  }
  addEventListener("resize", resize);
  resize();

  function beep(freq = 440, duration = 0.08, type = "sine", volume = 0.035) {
    if (!audioEnabled) return;
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch {}
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 900);
  }

  function showMenu() {
    state = "menu";
    overlay.classList.remove("hidden");
    document.getElementById("topbar").style.opacity = ".25";
    panel.innerHTML = `
      <p class="eyebrow">Physics puzzle game</p>
      <h1><span class="gradient-text">Gravity<br>Shift</span></h1>
      <p class="subtitle">
        Guide the energy core through dangerous rooms by changing the direction of gravity.
        Collect stars, dodge spikes, and reach the portal.
      </p>
      <div class="button-row">
        <button class="primary" id="playBtn">Play game</button>
        <button class="secondary" id="levelsBtn">Choose level</button>
      </div>
      <div class="controls-card">
        <div class="control">
          <strong>Change gravity</strong>
          <kbd>WASD</kbd> or <kbd>Arrow keys</kbd>
        </div>
        <div class="control">
          <strong>Quick controls</strong>
          <kbd>Q</kbd>/<kbd>E</kbd> rotate · <kbd>Space</kbd> reverse
        </div>
        <div class="control">
          <strong>Reset and pause</strong>
          <kbd>R</kbd> restart · <kbd>P</kbd> pause
        </div>
        <div class="control">
          <strong>Objective</strong>
          Reach the glowing portal. Stars are optional.
        </div>
      </div>`;
    document.getElementById("playBtn").onclick = () => startLevel(Math.min(saved.unlocked - 1, levels.length - 1));
    document.getElementById("levelsBtn").onclick = showLevelSelect;
  }

  function showLevelSelect() {
    state = "menu";
    overlay.classList.remove("hidden");
    let buttons = "";
    for (let i = 0; i < levels.length; i++) {
      const unlocked = i < saved.unlocked;
      const score = saved.stars[i] || 0;
      buttons += `
        <button class="level-btn" data-level="${i}" ${unlocked ? "" : "disabled"}>
          ${i + 1}<span class="stars">${unlocked ? "★".repeat(score) + "☆".repeat(3-score) : "LOCKED"}</span>
        </button>`;
    }
    panel.innerHTML = `
      <p class="eyebrow">Select chamber</p>
      <h1 style="font-size:clamp(34px,7vw,58px)">Level Select</h1>
      <p class="subtitle">Finish a chamber to unlock the next one. Your best star count is saved automatically.</p>
      <div id="levelGrid">${buttons}</div>
      <div class="button-row" style="margin-top:18px">
        <button class="secondary" id="backBtn">Back</button>
      </div>`;
    panel.querySelectorAll(".level-btn:not(:disabled)").forEach(btn => {
      btn.onclick = () => startLevel(Number(btn.dataset.level));
    });
    document.getElementById("backBtn").onclick = showMenu;
  }

  function parseLevel(index) {
    map = levels[index].map.map(row => row.split(""));
    stars = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = map[y][x];
        if (c === "S") {
          start = { x: x * TILE + TILE / 2, y: y * TILE + TILE / 2 };
          map[y][x] = ".";
        } else if (c === "E") {
          exit = { x: x * TILE + TILE / 2, y: y * TILE + TILE / 2 };
          map[y][x] = ".";
        } else if (c === "*") {
          stars.push({ x: x * TILE + TILE / 2, y: y * TILE + TILE / 2, collected: false, pulse: Math.random() * Math.PI * 2 });
          map[y][x] = ".";
        }
      }
    }
  }

  function startLevel(index) {
    levelIndex = Math.max(0, Math.min(index, levels.length - 1));
    parseLevel(levelIndex);
    player.x = start.x;
    player.y = start.y;
    player.vx = 0;
    player.vy = 0;
    player.trail = [];
    gravity = "down";
    shifts = 0;
    elapsed = 0;
    collected = 0;
    particles = [];
    shake = 0;
    deathFlash = 0;
    transitionFlash = 1;
    paused = false;
    state = "playing";
    overlay.classList.add("hidden");
    document.getElementById("topbar").style.opacity = "1";
    updateHUD();
    showToast(levels[levelIndex].tip);
    beep(360, .08, "triangle");
  }

  function restartLevel() {
    if (state === "playing" || state === "paused") startLevel(levelIndex);
  }

  function updateHUD() {
    levelText.textContent = `${levelIndex + 1}/${levels.length}`;
    movesText.textContent = shifts;
    timeText.textContent = elapsed.toFixed(1);
    gravityText.textContent = gravityVectors[gravity].label;
    gravityArrow.textContent = gravityVectors[gravity].arrow;
  }

  function setGravity(dir) {
    if (state !== "playing" || paused || !gravityVectors[dir] || dir === gravity) return;
    gravity = dir;
    shifts++;
    updateHUD();
    burst(player.x, player.y, 10, "shift");
    beep(220 + shifts % 4 * 45, .055, "square", .022);
  }

  function rotateGravity(direction) {
    setGravity(direction === "cw" ? clockwise[gravity] : counterClockwise[gravity]);
  }

  function reverseGravity() {
    setGravity(opposite[gravity]);
  }

  function togglePause(force) {
    if (state !== "playing" && state !== "paused") return;
    paused = typeof force === "boolean" ? force : !paused;
    state = paused ? "paused" : "playing";
    if (paused) {
      overlay.classList.remove("hidden");
      panel.innerHTML = `
        <p class="eyebrow">Game paused</p>
        <h1 style="font-size:clamp(40px,8vw,66px)">Paused</h1>
        <p class="subtitle">Take a breath. Gravity will wait.</p>
        <div class="button-row">
          <button class="primary" id="resumeBtn">Resume</button>
          <button class="secondary" id="restartBtn">Restart</button>
          <button class="secondary" id="menuBtn">Main menu</button>
        </div>`;
      document.getElementById("resumeBtn").onclick = () => togglePause(false);
      document.getElementById("restartBtn").onclick = restartLevel;
      document.getElementById("menuBtn").onclick = showMenu;
    } else {
      overlay.classList.add("hidden");
      lastTime = performance.now();
    }
  }

  function completeLevel() {
    state = "complete";
    beep(523, .12, "sine", .05);
    setTimeout(() => beep(659, .14, "sine", .05), 90);
    setTimeout(() => beep(784, .2, "sine", .05), 190);
    burst(exit.x, exit.y, 55, "win");
    const total = stars.length;
    const rating = total ? Math.round((collected / total) * 3) : 3;
    saved.stars[levelIndex] = Math.max(saved.stars[levelIndex] || 0, rating);
    if (levelIndex + 2 > saved.unlocked) saved.unlocked = Math.min(levels.length, levelIndex + 2);
    saveProgress();
    setTimeout(() => {
      overlay.classList.remove("hidden");
      const allDone = levelIndex === levels.length - 1;
      panel.innerHTML = `
        <p class="eyebrow">${allDone ? "All chambers cleared" : "Chamber cleared"}</p>
        <h1 style="font-size:clamp(38px,8vw,66px)">${allDone ? "Gravity Master" : levels[levelIndex].name}</h1>
        <p class="subtitle">
          Time: <strong style="color:#fff">${elapsed.toFixed(1)}s</strong> ·
          Gravity shifts: <strong style="color:#fff">${shifts}</strong> ·
          Stars: <strong style="color:#ffd765">${"★".repeat(rating)}${"☆".repeat(3-rating)}</strong>
        </p>
        <div class="button-row">
          ${allDone
            ? `<button class="primary" id="replayBtn">Play again</button>`
            : `<button class="primary" id="nextBtn">Next level</button>`}
          <button class="secondary" id="retryBtn">Retry</button>
          <button class="secondary" id="selectBtn">Level select</button>
        </div>`;
      if (allDone) document.getElementById("replayBtn").onclick = () => startLevel(0);
      else document.getElementById("nextBtn").onclick = () => startLevel(levelIndex + 1);
      document.getElementById("retryBtn").onclick = () => startLevel(levelIndex);
      document.getElementById("selectBtn").onclick = showLevelSelect;
    }, 450);
  }

  function die() {
    if (state !== "playing") return;
    state = "dying";
    shake = 16;
    deathFlash = 1;
    burst(player.x, player.y, 38, "death");
    beep(120, .24, "sawtooth", .06);
    setTimeout(() => {
      if (state === "dying") startLevel(levelIndex);
    }, 620);
  }

  function burst(x, y, count, type) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = type === "win" ? 100 + Math.random() * 320 : 60 + Math.random() * 220;
      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life: .35 + Math.random() * .65,
        maxLife: .35 + Math.random() * .65,
        size: 2 + Math.random() * 5,
        type
      });
    }
  }

  function tileAt(tx, ty) {
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return "#";
    return map[ty][tx];
  }

  function resolveCircleRect(rectX, rectY, rectW, rectH) {
    const nearestX = Math.max(rectX, Math.min(player.x, rectX + rectW));
    const nearestY = Math.max(rectY, Math.min(player.y, rectY + rectH));
    let dx = player.x - nearestX;
    let dy = player.y - nearestY;
    let distSq = dx * dx + dy * dy;
    const r = player.r;
    if (distSq >= r * r) return false;

    if (distSq < 0.0001) {
      const left = Math.abs(player.x - rectX);
      const right = Math.abs(rectX + rectW - player.x);
      const top = Math.abs(player.y - rectY);
      const bottom = Math.abs(rectY + rectH - player.y);
      const min = Math.min(left, right, top, bottom);
      if (min === left) { dx = -1; dy = 0; }
      else if (min === right) { dx = 1; dy = 0; }
      else if (min === top) { dx = 0; dy = -1; }
      else { dx = 0; dy = 1; }
      distSq = 1;
    }

    const dist = Math.sqrt(distSq);
    const nx = dx / dist;
    const ny = dy / dist;
    const overlap = r - dist;
    player.x += nx * overlap;
    player.y += ny * overlap;

    const vn = player.vx * nx + player.vy * ny;
    if (vn < 0) {
      player.vx -= vn * nx * 1.12;
      player.vy -= vn * ny * 1.12;
      player.vx *= .985;
      player.vy *= .985;
    }
    return true;
  }

  function collideWorld() {
    const minTX = Math.floor((player.x - player.r) / TILE);
    const maxTX = Math.floor((player.x + player.r) / TILE);
    const minTY = Math.floor((player.y - player.r) / TILE);
    const maxTY = Math.floor((player.y + player.r) / TILE);

    for (let ty = minTY; ty <= maxTY; ty++) {
      for (let tx = minTX; tx <= maxTX; tx++) {
        if (tileAt(tx, ty) === "#") {
          resolveCircleRect(tx * TILE, ty * TILE, TILE, TILE);
        }
      }
    }
  }

  function checkHazards() {
    const minTX = Math.floor((player.x - player.r * .72) / TILE);
    const maxTX = Math.floor((player.x + player.r * .72) / TILE);
    const minTY = Math.floor((player.y - player.r * .72) / TILE);
    const maxTY = Math.floor((player.y + player.r * .72) / TILE);
    for (let ty = minTY; ty <= maxTY; ty++) {
      for (let tx = minTX; tx <= maxTX; tx++) {
        if (tileAt(tx, ty) === "X") return true;
      }
    }
    return false;
  }

  function update(dt) {
    transitionFlash = Math.max(0, transitionFlash - dt * 2.5);
    deathFlash = Math.max(0, deathFlash - dt * 2.6);
    shake = Math.max(0, shake - dt * 32);

    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(.05, dt);
      p.vy *= Math.pow(.05, dt);
    }
    particles = particles.filter(p => p.life > 0);

    if (state !== "playing" || paused) return;

    elapsed += dt;
    const g = gravityVectors[gravity];
    const accel = 920;
    const maxSpeed = 620;
    const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
    const sdt = dt / steps;

    for (let s = 0; s < steps; s++) {
      player.vx += g.x * accel * sdt;
      player.vy += g.y * accel * sdt;
      const speed = Math.hypot(player.vx, player.vy);
      if (speed > maxSpeed) {
        player.vx = player.vx / speed * maxSpeed;
        player.vy = player.vy / speed * maxSpeed;
      }
      player.x += player.vx * sdt;
      player.y += player.vy * sdt;
      collideWorld();
      if (checkHazards()) {
        die();
        return;
      }
    }

    player.trail.unshift({x: player.x, y: player.y, life: 1});
    if (player.trail.length > 24) player.trail.pop();
    for (const t of player.trail) t.life *= .91;

    for (const star of stars) {
      star.pulse += dt * 4;
      if (!star.collected && Math.hypot(player.x - star.x, player.y - star.y) < player.r + 16) {
        star.collected = true;
        collected++;
        burst(star.x, star.y, 18, "star");
        beep(820 + collected * 80, .09, "sine", .035);
      }
    }

    if (Math.hypot(player.x - exit.x, player.y - exit.y) < player.r + 24) {
      completeLevel();
    }
    updateHUD();
  }

  function roundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBackground(t) {
    const grad = ctx.createLinearGradient(0, 0, screenW, screenH);
    grad.addColorStop(0, "#070a13");
    grad.addColorStop(.55, "#0a1022");
    grad.addColorStop(1, "#050810");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, screenW, screenH);

    ctx.save();
    ctx.globalAlpha = .16;
    ctx.strokeStyle = "#6073b8";
    ctx.lineWidth = 1;
    const grid = 44;
    const ox = (t * 5) % grid;
    const oy = (t * 3) % grid;
    for (let x = -grid + ox; x < screenW + grid; x += grid) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, screenH); ctx.stroke();
    }
    for (let y = -grid + oy; y < screenH + grid; y += grid) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(screenW, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawWorld(t) {
    const sx = shake ? (Math.random() - .5) * shake : 0;
    const sy = shake ? (Math.random() - .5) * shake : 0;

    ctx.save();
    ctx.translate(offsetX + sx, offsetY + sy);
    ctx.scale(scale, scale);

    // Board shadow and floor
    ctx.shadowColor = "rgba(0,0,0,.65)";
    ctx.shadowBlur = 45;
    ctx.fillStyle = "#0c1326";
    roundedRect(0, 0, WORLD_W, WORLD_H, 18);
    ctx.fill();
    ctx.shadowBlur = 0;

    const floorGrad = ctx.createLinearGradient(0, 0, WORLD_W, WORLD_H);
    floorGrad.addColorStop(0, "#111a32");
    floorGrad.addColorStop(1, "#0a1020");
    ctx.fillStyle = floorGrad;
    roundedRect(0, 0, WORLD_W, WORLD_H, 18);
    ctx.fill();

    // Fine floor grid
    ctx.globalAlpha = .15;
    ctx.strokeStyle = "#7592d6";
    ctx.lineWidth = 1;
    for (let x = 0; x <= WORLD_W; x += TILE) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke();
    }
    for (let y = 0; y <= WORLD_H; y += TILE) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Exit portal
    const pulse = .5 + .5 * Math.sin(t * 4);
    ctx.save();
    ctx.translate(exit.x, exit.y);
    ctx.rotate(t * .65);
    ctx.shadowColor = "#7af0ff";
    ctx.shadowBlur = 18 + pulse * 12;
    ctx.strokeStyle = `rgba(114,232,255,${.75 + pulse * .2})`;
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(0, 0, 24 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(161,117,255,.9)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 1.55); ctx.stroke();
    ctx.restore();

    // Tiles
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const tile = map[y]?.[x];
        const px = x * TILE;
        const py = y * TILE;
        if (tile === "#") drawWall(px, py);
        else if (tile === "X") drawHazard(px, py, t, x, y);
      }
    }

    // Stars
    for (const star of stars) {
      if (star.collected) continue;
      drawStar(star.x, star.y, 12 + Math.sin(star.pulse) * 1.5, star.pulse);
    }

    // Gravity dust
    drawGravityDust(t);

    // Trail
    for (let i = player.trail.length - 1; i >= 0; i--) {
      const tr = player.trail[i];
      const rr = player.r * (.2 + tr.life * .45);
      ctx.globalAlpha = tr.life * .18;
      ctx.fillStyle = "#7feeff";
      ctx.beginPath(); ctx.arc(tr.x, tr.y, rr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Player
    if (state !== "dying") drawPlayer(t);

    // Particles
    for (const p of particles) drawParticle(p);

    ctx.restore();

    // level title
    if (state === "playing" && elapsed < 2.6) {
      const alpha = Math.min(1, elapsed * 2) * Math.min(1, (2.6 - elapsed) * 1.5);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "900 22px system-ui";
      ctx.fillText(`${levelIndex + 1}. ${levels[levelIndex].name}`, screenW / 2, offsetY + 64);
      ctx.restore();
    }
  }

  function drawWall(x, y) {
    const grad = ctx.createLinearGradient(x, y, x + TILE, y + TILE);
    grad.addColorStop(0, "#263457");
    grad.addColorStop(1, "#17223f");
    ctx.fillStyle = grad;
    ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);

    ctx.fillStyle = "rgba(255,255,255,.065)";
    ctx.fillRect(x + 4, y + 4, TILE - 8, 3);
    ctx.fillRect(x + 4, y + 4, 3, TILE - 8);

    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(x + 5, y + TILE - 8, TILE - 10, 4);
    ctx.fillRect(x + TILE - 8, y + 5, 4, TILE - 10);

    ctx.strokeStyle = "rgba(120,158,255,.18)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
  }

  function drawHazard(x, y, t, gx, gy) {
    const flicker = .75 + .25 * Math.sin(t * 6 + gx * .8 + gy * .5);
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = `rgba(91,16,36,${.55 + flicker * .2})`;
    ctx.fillRect(2, 2, TILE - 4, TILE - 4);
    ctx.shadowColor = "#ff4f72";
    ctx.shadowBlur = 10 * flicker;
    ctx.fillStyle = "#ff5f7d";
    const spikes = 4;
    const w = TILE / spikes;
    for (let i = 0; i < spikes; i++) {
      ctx.beginPath();
      ctx.moveTo(i * w + 2, TILE - 4);
      ctx.lineTo(i * w + w / 2, 5);
      ctx.lineTo((i + 1) * w - 2, TILE - 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawStar(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot * .15);
    ctx.shadowColor = "#ffd85e";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ffe27a";
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 === 0 ? r : r * .45;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawGravityDust(t) {
    const g = gravityVectors[gravity];
    ctx.save();
    ctx.globalAlpha = .16;
    ctx.strokeStyle = "#80eaff";
    ctx.lineWidth = 2;
    for (let i = 0; i < 34; i++) {
      const seed = i * 97.31;
      const x = (seed * 7.7 + t * g.x * 130) % WORLD_W;
      const y = (seed * 4.9 + t * g.y * 130) % WORLD_H;
      const px = (x + WORLD_W) % WORLD_W;
      const py = (y + WORLD_H) % WORLD_H;
      ctx.beginPath();
      ctx.moveTo(px - g.x * 8, py - g.y * 8);
      ctx.lineTo(px + g.x * 8, py + g.y * 8);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer(t) {
    const speed = Math.min(1, Math.hypot(player.vx, player.vy) / 500);
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.shadowColor = "#78ebff";
    ctx.shadowBlur = 18 + speed * 12;
    const grad = ctx.createRadialGradient(-5, -6, 2, 0, 0, player.r + 3);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(.28, "#a9f6ff");
    grad.addColorStop(.72, "#55d7f0");
    grad.addColorStop(1, "#236987");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.fill();

    ctx.globalAlpha = .75;
    ctx.strokeStyle = "#d9fcff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, player.r - 4, t * 2, t * 2 + Math.PI * 1.2);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticle(p) {
    const a = Math.max(0, p.life / p.maxLife);
    let color = "#7feeff";
    if (p.type === "death") color = "#ff5878";
    else if (p.type === "star") color = "#ffe070";
    else if (p.type === "win") color = Math.random() > .5 ? "#7feeff" : "#a77bff";
    ctx.globalAlpha = a;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function render(now) {
    const t = now / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground(t);
    if (map.length) drawWorld(t);

    if (transitionFlash > 0 || deathFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(transitionFlash * .5, deathFlash * .7);
      ctx.fillStyle = deathFlash > transitionFlash ? "#ff4d6f" : "#91f6ff";
      ctx.fillRect(0, 0, screenW, screenH);
      ctx.restore();
    }
  }

  function loop(now) {
    const dt = Math.min(.033, (now - lastTime) / 1000 || 0);
    lastTime = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  addEventListener("keydown", e => {
    const key = e.key.toLowerCase();
    const block = ["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d","q","e","r","p"];
    if (block.includes(key)) e.preventDefault();

    if (key === "arrowup" || key === "w") setGravity("up");
    else if (key === "arrowdown" || key === "s") setGravity("down");
    else if (key === "arrowleft" || key === "a") setGravity("left");
    else if (key === "arrowright" || key === "d") setGravity("right");
    else if (key === "q") rotateGravity("ccw");
    else if (key === "e") rotateGravity("cw");
    else if (key === " ") reverseGravity();
    else if (key === "r") restartLevel();
    else if (key === "p" || key === "escape") togglePause();
    else if (key === "enter" && state === "menu") startLevel(Math.min(saved.unlocked - 1, levels.length - 1));
  }, { passive: false });

  document.querySelectorAll("[data-gravity]").forEach(btn => {
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      setGravity(btn.dataset.gravity);
    });
  });
  document.getElementById("mobileReset").onclick = restartLevel;
  document.getElementById("pauseBtn").onclick = () => togglePause();

  soundBtn.onclick = () => {
    audioEnabled = !audioEnabled;
    soundBtn.textContent = audioEnabled ? "♪" : "×";
    showToast(audioEnabled ? "Sound on" : "Sound off");
    if (audioEnabled) beep(540, .06);
  };

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") togglePause(true);
  });

  showMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
